<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shop Agent Panel</title>
<style>
:root{--bg:#f4f5f9;--card:#fff;--tx:#161a23;--mu:#6b7385;--bd:#e6e8ef;--ac:#5b5bf0;--ac2:#ececff;--ok:#12803f;--wa:#a8590a;--er:#c0262d;--okb:#e1f7e8;--wab:#fdf0d5;--erb:#fde6e6;--sh:0 1px 2px rgba(20,24,40,.05),0 4px 14px rgba(20,24,40,.05);--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#0e1016;--card:#171a22;--tx:#eceef3;--mu:#9aa2b3;--bd:#262a35;--ac:#8484ff;--ac2:#25274a;--ok:#4ade80;--wa:#fbbf24;--er:#ff7b7b;--okb:#123022;--wab:#3a2c0a;--erb:#3b1616;--sh:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:14.5px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
header b{flex:1;font-size:16px;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
header b::before{content:"";width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--ac),#9b6bff);display:inline-block}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:53px;z-index:5;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;background:transparent;color:var(--mu);padding:8px 14px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;transition:.15s}
nav button:hover{background:var(--bg)}
nav button.on{background:var(--ac2);color:var(--ac)}
main{padding:14px;max-width:960px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card h3{margin:0 0 10px;font-size:15px;letter-spacing:-.1px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ac);opacity:.8}
.stat b{display:block;font-size:24px;letter-spacing:-.5px}.stat span{color:var(--mu);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.sp{justify-content:space-between}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--ac);color:var(--ac)}.btn:active{transform:scale(.97)}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.p:hover{filter:brightness(1.08);color:#fff}
.btn.d{color:var(--er)}.btn.d:hover{border-color:var(--er);color:var(--er)}
.btn.s{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.5}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;transition:.15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac2);background:var(--card)}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:10px 0 4px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}.sw:last-child{border-bottom:0}
.sw input[type=checkbox]{appearance:none;-webkit-appearance:none;width:44px;height:26px;padding:0;border-radius:99px;background:var(--bd);position:relative;cursor:pointer;transition:.2s;flex:none;border:0}
.sw input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input[type=checkbox]:checked{background:var(--ac)}.sw input[type=checkbox]:checked::after{left:21px}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--bg);color:var(--mu)}
.b-ok{background:var(--okb);color:var(--ok)}.b-wa{background:var(--wab);color:var(--wa)}.b-er{background:var(--erb);color:var(--er)}
.mu{color:var(--mu)}.sm{font-size:12.5px}
details{border:1px solid var(--bd);border-radius:12px;margin-bottom:10px;background:var(--card);box-shadow:var(--sh)}
summary{padding:12px 14px;cursor:pointer;list-style:none;font-weight:600}summary::-webkit-details-marker{display:none}
summary::after{content:"›";float:right;color:var(--mu);transition:.2s}details[open]>summary::after{transform:rotate(90deg)}
details>div{padding:0 14px 14px}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--bg);flex:none}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.imgs div{position:relative}.imgs img{width:66px;height:66px;object-fit:cover;border-radius:10px}
.imgs button{position:absolute;top:-6px;right:-6px;border:0;background:var(--er);color:#fff;border-radius:50%;width:20px;height:20px}
#log{font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
.ll{padding:5px 10px;border-bottom:1px solid var(--bd);word-break:break-word}
.ll.warn{background:var(--wab)}.ll.error{background:var(--erb)}.ll .t{color:var(--mu)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:12.5px;font-weight:600;transition:.15s}.chip:hover{border-color:var(--ac)}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.chat{height:58vh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:6px}
.bub{max-width:82%;padding:9px 13px;border-radius:16px;white-space:pre-wrap;word-break:break-word}
.me{align-self:flex-end;background:var(--ac);color:#fff;border-bottom-right-radius:5px}.bot{align-self:flex-start;background:var(--bg);border:1px solid var(--bd);border-bottom-left-radius:5px}
.bub img{max-width:200px;border-radius:10px;display:block}
.cl{display:flex;gap:8px;overflow:auto}.cl>div{flex:none;width:150px;border:1px solid var(--bd);border-radius:12px;padding:7px;font-size:12px;background:var(--card)}.cl img{width:100%;border-radius:8px}
#login{max-width:360px;margin:16vh auto;padding:0 16px}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:#161a23;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90%;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{background:var(--er)}
#ov{position:fixed;inset:0;background:rgba(10,12,20,.5);backdrop-filter:blur(3px);z-index:15;display:none}#ov>div{background:var(--card);max-width:540px;margin:50px auto;border-radius:16px;padding:16px;max-height:80vh;overflow:auto;box-shadow:var(--sh)}
.n{padding:10px 0;border-bottom:1px solid var(--bd)}.n:last-child{border-bottom:0}.n.un b::before{content:"● ";color:var(--ac)}
pre{white-space:pre-wrap;word-break:break-word;margin:0;font:12px/1.5 ui-monospace,Menlo,monospace}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--bd)}.chk:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}.dot.g{background:#22c55e;box-shadow:0 0 0 4px var(--okb)}.dot.r{background:#ef4444;box-shadow:0 0 0 4px var(--erb)}.dot.y{background:#f59e0b;box-shadow:0 0 0 4px var(--wab)}
@media(min-width:760px){main{padding:20px}.card{padding:18px}}
</style>
</head>
<body>
<div id="login" hidden>
  <div class="card"><h3>Admin login</h3><div id="boot" class="sm mu" style="margin-bottom:8px"></div>
  <input id="un" value="admin" placeholder="Username" autocomplete="username" style="margin-bottom:8px">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <div style="height:10px"></div><button class="btn p" style="width:100%" data-a="login">Login</button></div>
</div>
<div id="app" hidden>
  <header><b>Shop Agent</b><span id="botb" class="badge"></span><button class="btn s" data-a="bell">Alert <span id="bn"></span></button><button class="btn s" data-a="logout">Logout</button></header>
  <nav id="tabs"></nav>
  <main id="main"></main>
</div>
<div id="ov"><div id="ovc"></div></div>
<div id="toast"></div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Math.round(Number(n)||0).toLocaleString('en-US')+' tk';
const TABS=[['dash','🏠 Home'],['orders','🛒 Orders'],['products','👕 Products'],['inbox','💬 Inbox'],['logs','📜 Logs'],['data','🗂 Data'],['settings','⚙️ Settings'],['test','🤖 Test chat']];
let ME={role:'staff',perms:[]};const TABPERM={orders:'orders',products:'products',inbox:'inbox',logs:'logs',data:'data',settings:'settings',test:'test'};
let page='dash',es=null,mods=[],pf=null,dataTab='kb',dataEdit=null,sess=Math.random().toString(36).slice(2,9);

async function api(p,o={}){
  const init={method:o.method||'GET',headers:{},credentials:'same-origin'};
  if(o.body!==undefined){init.headers['Content-Type']='application/json';init.body=JSON.stringify(o.body)}
  const r=await fetch('/api'+p,init);
  if(r.status===401){showLogin();throw new Error('Login korun')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
  return j;
}
let tt;function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='show'+(bad?' bad':'');clearTimeout(tt);tt=setTimeout(()=>t.className='',3200)}
const run=async(fn)=>{try{return await fn()}catch(e){toast(e.message,true)}};

function showLogin(){$('#app').hidden=true;$('#login').hidden=false;fetch('/health').then(r=>r.json()).then(h=>{$('#boot').textContent=h.error||''}).catch(()=>{})}
async function start(){
  try{ME=(await api('/me')).user;$('#login').hidden=true;$('#app').hidden=false;
    $('#tabs').innerHTML=TABS.filter(t=>!TABPERM[t[0]]||ME.role==='owner'||ME.perms.includes(TABPERM[t[0]])).map(t=>`<button data-a="tab" data-p="${t[0]}">${t[1]}</button>`).join('');
    mods=await api('/modules').catch(()=>[]);go(location.hash.slice(1)||'dash');poll()}
  catch{showLogin()}
}
async function poll(){try{const d=await api('/dashboard');$('#bn').textContent=d.unread?'('+d.unread+')':'';const b=$('#botb');b.textContent=d.bot.bot_on?'Bot ON':'Bot OFF';b.className='badge '+(d.bot.bot_on?'b-ok':'b-er')}catch{}setTimeout(poll,30000)}
function go(p){
  page=p;location.hash=p;if(es){es.close();es=null}
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  $('#main').innerHTML='<div class="mu">Loading...</div>';
  run(()=>pages[p]());
}
const badge=(s)=>{const m={confirmed:'b-ok',delivered:'b-ok',shipped:'b-ok',pending:'b-wa',awaiting_payment:'b-wa',payment_review:'b-wa',cancelled:'b-er',returned:'b-er'};return `<span class="badge ${m[s]||''}">${esc(s)}</span>`};
const sw=(k,l,v)=>`<div class="sw"><span>${l}</span><input type="checkbox" data-a="toggle" data-k="${k}" ${v?'checked':''}></div>`;
const ago=t=>{const s=Math.round((Date.now()-t)/1000);return s<60?s+'s':s<3600?Math.round(s/60)+'m':Math.round(s/3600)+'h'};

const pages={};
/* ---------- HOME ---------- */
pages.dash=async()=>{
  const d=await api('/dashboard');const c=d.counts||{};
  const aiKeys=d.ai.providers.reduce((a,p)=>a+p.keys.length,0);
  const warn=[];
  if(!d.fb.hasToken)warn.push('Facebook Page Token boshano hoyni (Settings > Facebook Connection)');
  if(!aiKeys)warn.push('Kono AI key boshano hoyni (Settings > AI providers)');
  if(!d.db)warn.push('Database connect nai');
  if(d.fb.sigFailAt&&d.fb.sigFailAt>(d.fb.lastEventAt||0))warn.push('Facebook theke message ashche kintu App Secret mile nai ('+ago(d.fb.sigFailAt)+' age), tai bot reply dicche na. Settings > Facebook > App Secret thik korun ba khali rakhun');
  if(d.fb.lastSendError&&d.fb.lastSendErrorAt>(d.fb.lastSendOkAt||0))warn.push('Customer ke reply pathano jayni ('+ago(d.fb.lastSendErrorAt)+' age): '+d.fb.lastSendError);
  if(d.fb.standbyAt&&Date.now()-d.fb.standbyAt<86400000)warn.push('Message "standby" e ashche: onno app primary receiver. Facebook App > Messenger > Handover Protocol e ei app ke Primary Receiver korun');
  if(d.fb.hasToken&&!d.fb.lastHitAt)warn.push('Server start howar por Facebook theke ekta webhook request-o ashe nai. Facebook Developer > Webhooks e Callback URL/Verify Token ar Page subscribe check korun, ar App Live mode e ache ki na dekhun');
  $('#main').innerHTML=`
  ${warn.map(w=>`<div class="card" style="border-color:var(--wa)"><b style="color:var(--wa)">Setup baki:</b> ${esc(w)}</div>`).join('')}
  <div class="card"><h3>System health</h3>${[
    [d.fb.hasToken&&!d.fb.tokenInvalid,'Facebook Page token',d.fb.hasToken?(d.fb.tokenInvalid?'Token invalid, notun token din':'Thik ache'):'Token nai'],
    [(d.fb.subFields||[]).includes('messages'),'Messenger webhook',(d.fb.subFields||[]).includes('messages')?'Subscribed':'Subscribe hoyni (Home > Webhook subscribe chapun)'],
    [(d.fb.subFields||[]).includes('feed'),'Comment (feed) webhook',(d.fb.subFields||[]).includes('feed')?'Subscribed, comment e reply jabe':'Subscribe hoyni: Webhook subscribe chapun, ar Facebook Developer e Page > feed Subscribe korun'],
    [aiKeys>0,'AI key',aiKeys>0?aiKeys+' ta key ache':'Key nai: Settings > AI providers e key boshan'],
    [!!d.fb.lastEventAt,'Last Facebook event',d.fb.lastEventAt?ago(d.fb.lastEventAt)+' age':'Ekhono kono event ashe nai']
  ].map(x=>`<div class="chk"><span class="dot ${x[0]?'g':'r'}"></span><div><b>${x[1]}</b><div class="sm mu">${esc(x[2])}</div></div></div>`).join('')}</div>
  <div class="card"><h3>Bot control</h3>${sw('bot_on','Bot chalu (master)',d.bot.bot_on)}${sw('messenger_on','Messenger reply',d.bot.messenger_on)}${sw('comment_on','Comment reply',d.bot.comment_on)}</div>
  <div class="grid">
    <div class="stat"><b>${d.today.orders}</b><span>Ajker order</span></div>
    <div class="stat"><b>${money(d.today.revenue)}</b><span>Ajker bikri</span></div>
    <div class="stat"><b>${c.pending||0}</b><span>Approval lagbe</span></div>
    <div class="stat"><b>${c.payment_review||0}</b><span>Payment verify</span></div>
    <div class="stat"><b>${d.attention}</b><span>Needs attention</span></div>
    <div class="stat"><b>${d.unknown}</b><span>AI jane na (proshno)</span></div>
    <div class="stat"><b>${d.tickets||0}</b><span>Open ticket</span></div>
  </div><div style="height:12px"></div>
  <div class="card"><h3>Facebook connection</h3><div id="conn" class="sm mu">Last event: ${d.fb.lastEventAt?ago(d.fb.lastEventAt)+' age':'ekhono kono event ashe nai'}</div>
    <div class="row" style="margin-top:8px"><button class="btn s p" data-a="conn">Test connection</button><button class="btn s" data-a="subscribe">Webhook subscribe</button></div>
    <label>Webhook URL (Facebook Developer e dien)</label><input readonly value="${esc(d.webhook.url)}" onclick="this.select()">
    <label>Verify Token</label><input readonly value="${esc(d.webhook.verify)}" onclick="this.select()"></div>
  <div class="card"><h3>AI status</h3>${d.ai.providers.map(p=>`<div class="sm" style="margin:6px 0"><b>${esc(p.name)}</b> <span class="mu">${esc(p.model)}</span> ${p.on?'':'<span class="badge">off</span>'}<br>${p.keys.length?p.keys.map(k=>`<span class="badge ${k.ok===true?'b-ok':k.ok===false?'b-er':''}" title="${esc(k.err||'')}">${esc(k.id)} ...${esc(k.last4)} ${k.ok===true?'ok':k.ok===false?'fail':'untested'}</span>`).join(' '):'<span class="mu">key nai</span>'}</div>`).join('')}
    <div class="sm mu" style="margin-top:8px">Ajke: ${d.ai.usage.calls||0} call, ${d.ai.usage.tokens||0} token, ${d.ai.usage.fails||0} fail${d.ai.limit?' (limit '+d.ai.limit+')':''}</div></div>
  <div class="card"><h3>System</h3><div class="sm mu">Uptime ${Math.round(d.uptime/60)} min | Modules: ${mods.map(m=>m.title+(m.enabled?'':' (off)')).join(', ')||'nai'}</div>
    <div class="row" style="margin-top:8px"><button class="btn s" data-a="soft">Soft restart</button><button class="btn s d" data-a="hard">Server restart</button><button class="btn s" data-a="backup">Backup download</button><label class="btn s" style="margin:0">Restore<input type="file" accept=".json" hidden data-a="restore"></label></div></div>`;
};
/* ---------- ORDERS ---------- */
let ofil='';
pages.orders=async()=>{
  const list=await api('/orders'+(ofil?'?status='+ofil:''));
  const sts=['','pending','awaiting_payment','payment_review','confirmed','shipped','delivered','cancelled','returned'];
  $('#main').innerHTML=`<div class="chips">${sts.map(s=>`<span class="chip ${ofil===s?'on':''}" data-a="ofil" data-s="${s}">${s||'all'}</span>`).join('')}</div>`+
  (list.map(o=>{
    const acts=[];
    if(o.status==='pending')acts.push(['approve','Approve','p'],['st:cancelled','Reject','d']);
    if(o.status==='awaiting_payment')acts.push(['payment_received','Payment received','p'],['st:cancelled','Cancel','d']);
    if(o.status==='payment_review')acts.push(['payment_received','Payment received','p'],['payment_reject','Reject payment','d'],['st:cancelled','Cancel','d']);
    if(o.status==='confirmed')acts.push(['ship','Shipped','p'],['st:cancelled','Cancel','d']);
    if(o.status==='shipped')acts.push(['st:delivered','Delivered','p'],['st:returned','Returned','d']);
    const sf=mods.find(m=>m.name==='steadfast'&&m.enabled)&&o.status==='confirmed';
    const pt=mods.find(m=>m.name==='pathao'&&m.enabled)&&o.status==='confirmed';
    return `<details><summary><div class="row sp"><b>#${o.id} ${esc(o.name)}</b>${badge(o.status)}</div><div class="sm mu">${money(o.total)} | ${esc(o.mode)}${o.test?' | TEST':''}${(o.flags||[]).includes('duplicate')?' | duplicate?':''}${o.notice_failed?' | CUSTOMER KE MESSAGE JAYNI':''}${o.refund_pending?' | REFUND pending':''}</div></summary><div>
      ${o.lines.map(l=>`<div>${esc(l.name)}${l.variant?' ('+esc(l.variant)+')':''} ${Object.entries(l.options||{}).map(([k,v])=>esc(k)+': '+esc(v)).join(', ')} x ${l.qty} = ${money(l.total)}</div>`).join('')}
      <div class="sm mu">Delivery ${money(o.delivery)} | Total ${money(o.total)} | Paid ${money(o.paid||0)} | Pay now needed ${money(o.required_now)}</div>
      ${o.notice_failed?`<div class="sm" style="color:var(--er);margin-top:6px">Customer ke message jayni (Facebook 24 ghonta niyom). Call korun: ${esc(o.phone)}</div>`:''}
      <div style="margin-top:6px">${esc(o.phone)}<br>${esc(o.address)}</div>
      ${(o.payments||[]).map(p=>`<div class="sm" style="margin-top:6px"><span class="badge b-wa">${esc(p.state)}</span> TrxID <b>${esc(p.trx)}</b> | ${esc(p.sender)} | ${money(p.amount)}</div>`).join('')}
      ${(o.screenshots||[]).map(u=>`<a href="${esc(u)}" target="_blank" class="sm">Screenshot</a> `).join('')}
      ${o.tracking?`<div class="sm">Tracking: ${esc(o.tracking.courier)} ${esc(o.tracking.code)}</div>`:''}
      <div class="row" style="margin-top:8px">${acts.map(a=>`<button class="btn s ${a[2]||''}" data-a="oact" data-id="${o.id}" data-x="${a[0]}">${a[1]}</button>`).join('')}${sf?`<button class="btn s" data-a="steadfast" data-id="${o.id}">Steadfast e pathao</button>`:''}${pt?`<button class="btn s" data-a="pathao" data-id="${o.id}">Pathao te pathao</button>`:''}${o.refund_pending?`<button class="btn s" data-a="oact" data-id="${o.id}" data-x="refunded">Refund holo</button>`:''}${o.test?`<button class="btn s d" data-a="oact" data-id="${o.id}" data-x="delete">Delete</button>`:''}</div>
      <div class="sm mu" style="margin-top:6px">${(o.history||[]).map(h=>esc(h.status)+' ('+esc(h.by)+')').join(' > ')}</div></div></details>`}).join('')||'<div class="mu">Kono order nai</div>');
};
/* ---------- PRODUCTS ---------- */
const emptyP=()=>({code:'',name:'',variant:'',price:'',stock:'',category:'',description:'',aliases:'',optionsText:'',extraText:'',images:[],active:true});
pages.products=async()=>{
  const list=await api('/products');
  $('#main').innerHTML=`<div class="row sp" style="margin-bottom:10px"><b>${list.length} ta product</b><button class="btn p s" data-a="pnew">+ Notun product</button></div><div id="pform"></div>`+

  async usave(){const perms=[...document.querySelectorAll('.uf-p')].filter(c=>c.checked).map(c=>c.value);await api('/users',{method:'POST',body:{username:$('#uf-name').value,password:$('#uf-pw').value,perms,active:$('#uf-act').checked}});toast('Account save hoyeche');go('settings')},
  async udel(b){if(!confirm('Account delete korbo?'))return;await api('/users/'+encodeURIComponent(b.dataset.u),{method:'DELETE'});go('settings')},
  async pathao(b){const r=await api('/mod/pathao/ship/'+b.dataset.id,{method:'POST',body:{}});toast('Pathao: '+r.tracking.code);go('orders')},
  async steadfast(b){const r=await api('/mod/steadfast/ship/'+b.dataset.id,{method:'POST',body:{}});toast('Steadfast: '+r.tracking.code);go('orders')},
  pnew(){pf=emptyP();renderPF()},
  pedit(b){pf=JSON.parse(JSON.stringify(window._plist.find(p=>p.code===b.dataset.c)));renderPF()},
  pcancel(){pf=null;$('#pform').innerHTML=''},
  pimgdel(b){readPF();pf.images.splice(+b.dataset.i,1);renderPF()},
  async pupload(b){readPF();for(const f of b.files){try{const d=await resize(f);const r=await api('/upload',{method:'POST',body:{dataUrl:d}});pf.images.push(r.url)}catch(e){toast(e.message,true)}}renderPF()},
  async psave(){readPF();const r=await api('/products',{method:'POST',body:pf});toast(r.sameName&&r.sameName.length?'Save hoyeche. Sotorko: ekoi naam er aro product ache ('+r.sameName.join(', ')+'), variant label diye alada korun':'Save hoyeche');pf=null;go('products')},
  async pdel(){if(!confirm('Delete korbo?'))return;await api('/products/'+pf.code,{method:'DELETE'});pf=null;go('products')},
  async tkst(b){await api('/tickets/'+b.dataset.id,{method:'POST',body:{status:b.dataset.s}});go('inbox')},
  async tkreply(b){const v=$('#tr-'+b.dataset.id).value.trim();if(!v)return toast('Likhun',true);const r=await api('/tickets/'+b.dataset.id,{method:'POST',body:{reply:v}});toast(r.sent?'Customer ke gelo':'Message jayni (24 ghonta niyom). Call korun',!r.sent);go('inbox')},
  async tknote(b){const v=$('#tr-'+b.dataset.id).value.trim();if(!v)return toast('Likhun',true);await api('/tickets/'+b.dataset.id,{method:'POST',body:{note:v}});go('inbox')},
  async ares(b){await api(`/attention/${b.dataset.id}/resolve`,{method:'POST',body:{}});go('inbox')},
  async uans(b){const a=$('#ua-'+b.dataset.id).value;await api(`/unknown/${b.dataset.id}/answer`,{method:'POST',body:{answer:a}});toast('AI shikhe nilo');go('inbox')},
  async cust(b){await api('/customers/'+encodeURIComponent(b.dataset.p),{method:'POST',body:{action:b.dataset.x}});toast('Hoyeche');go('inbox')},
  lfil(b){lfil=b.dataset.f;document.querySelectorAll('[data-a=lfil]').forEach(c=>c.classList.toggle('on',c.dataset.f===lfil));lapply()},
  lpause(b){lpause=!lpause;b.textContent=lpause?'Resume':'Pause'},
  async lclear(){await api('/logs',{method:'DELETE'});$('#log').innerHTML='';lseen.clear();toast('Log clear hoyeche')},
  async lcopy(){const txt=[...document.querySelectorAll('#log .ll')].filter(r=>!r.hidden).map(r=>r.innerText.replace(/\n+/g,' | ').trim()).join('\n');
    try{await navigator.clipboard.writeText(txt)}catch{const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}
    toast('Log copy hoyeche ('+txt.split('\n').length+' line)')},
  dtab(b){dataTab=b.dataset.k;dataEdit=null;go('data')},
  dedit(b){dataEdit=window._dlist.find(x=>x._id===b.dataset.id);go('data')},
  dcancel(){dataEdit=null;go('data')},
  async dsave(){const body={};if(dataEdit)body._id=dataEdit._id;document.querySelectorAll('[data-df]').forEach(e=>{body[e.dataset.df]=e.type==='checkbox'?e.checked:e.value});await api('/c/'+dataTab,{method:'POST',body});dataEdit=null;toast('Save hoyeche');go('data')},
  async ddel(b){if(!confirm('Delete?'))return;await api(`/c/${dataTab}/${b.dataset.id}`,{method:'DELETE'});go('data')},
  async ssave(){const body={};document.querySelectorAll('[data-k]').forEach(e=>{if(e.dataset.a==='toggle')return;body[e.dataset.k]=e.type==='checkbox'?e.checked:e.value});await api('/settings',{method:'POST',body});toast('Shob save hoyeche')},
  async aitest(b){$('#aitest').textContent='Testing '+b.dataset.p+'...';const r=await api('/ai/test',{method:'POST',body:{provider:b.dataset.p}});$('#aitest').textContent=r.results.map(x=>`${x.ok?'OK  ':'FAIL'} ${x.id} ${x.ok?(x.ms?x.ms+'ms':'')+' '+(x.text||''):x.err}`).join('\n')},
  tsend(){sendTest()},
  async treset(){await api('/test-chat/reset',{method:'POST',body:{}});sess=Math.random().toString(36).slice(2,9);go('test')},
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.type==='file'||(b.type==='checkbox'&&b.dataset.a!=='toggle'))return;if(b.dataset.a==='toggle')return;const h=H[b.dataset.a];if(h)run(()=>h(b,e))});
document.addEventListener('change',e=>{const b=e.target;if(b.dataset&&b.dataset.a==='toggle'||(b.type==='file'&&H[b.dataset.a]))run(()=>H[b.dataset.a](b,e))});
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')run(()=>H.login())});
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')H.ovx()});
start();
</script>
